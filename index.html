<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Keo Bua Bao - Tran Tuan Anh</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
      crossorigin="anonymous"
    />
    <style>
      .user,
      #computer {
        width: 130px;
        font-size: 5rem;
      }
      .user.actived {
        background-color: #ffc107;
      }
    </style>
  </head>
  <body>
    <!-- Code here -->
    <div class="container">
      <h1 class="text-center text-info">Kéo Búa Bao</h1>
      <div class="row">
        <!-- Player -->
        <div class="col-6">
          <h2 class="text-center">Player</h2>
          <div
            class="d-flex flex-column justify-content-center align-items-center h-100"
          >
            <div class="mb-3">
              <button class="btn btn-outline-warning user" id="scissors">
                ✌️
              </button>
            </div>
            <div class="mb-3">
              <button class="btn btn-outline-warning user" id="rock">✊</button>
            </div>
            <div class="mb-3">
              <button class="btn btn-outline-warning user" id="paper">
                🖐️
              </button>
            </div>
          </div>
        </div>
        <!-- Bot -->
        <div class="col-6">
          <h2 class="text-center">Bot</h2>
          <div
            class="d-flex flex-column justify-content-center align-items-center h-100"
          >
            <div class="mb-3">
              <span id="computer" data-id="scissors">✌️</span>
            </div>
          </div>
        </div>
        <!-- notifications -->
        <div class="notification text-center mt-3">
          <!-- Content here -->
        </div>
        <div id="play-again" class="text-center d-none">
          <button class="btn btn-play-again btn-outline-primary">
            Play Again
          </button>
        </div>
      </div>
    </div>
    <!-- Scripts -->
    <script src="./script.js"></script>
  </body>
</html>
